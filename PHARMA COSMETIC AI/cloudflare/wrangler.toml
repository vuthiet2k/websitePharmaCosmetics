# Cloudflare Workers — Pharma Cosmetics AI (API tra cứu). Xem HUONG-DAN-CAI-DAT-CLOUDFLARE.md để cài.
name = "pharma-cosmetics-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Chỉ mục BM25 chia mảnh nằm ở public/idx/ — Worker đọc qua binding ASSETS (không công khai trực tiếp: Worker chạy trước).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
# BẮT BUỘC đặt đúng domain website (CSV, có https://, không dấu / cuối). Để trống = chặn mọi trình duyệt gọi chéo domain.
# Ví dụ: "https://pharmacosmetics-vn.com,https://www.pharmacosmetics-vn.com"
ALLOWED_ORIGINS = "https://pharmacosmetics-vn.com,https://www.pharmacosmetics-vn.com"
RATE_LIMIT_PER_MIN = "20"
MAX_MESSAGES = "20"
MAX_CHARS = "500"
EXPERT_TITLE = "Chuyên gia"
