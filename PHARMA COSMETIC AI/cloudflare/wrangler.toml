# Cloudflare Workers — Pharma Cosmetics AI (API tra cứu). Xem HUONG-DAN-CAI-DAT-CLOUDFLARE.md để cài.
name = "pharma-cosmetics-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Chỉ mục BM25 chia mảnh nằm ở public/idx/ — Worker đọc qua binding ASSETS (không công khai trực tiếp: Worker chạy trước).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
# BẮT BUỘC đặt đúng domain website (CSV, có https://, không dấu / cuối). Để trống = chặn mọi trình duyệt gọi chéo domain.
# Ví dụ: "https://pharmacosmetics-vn.com,https://www.pharmacosmetics-vn.com"
ALLOWED_ORIGINS = "https://pharmacosmetics-vn.com,https://www.pharmacosmetics-vn.com"
RATE_LIMIT_PER_MIN = "20"
MAX_MESSAGES = "20"
MAX_CHARS = "500"
EXPERT_TITLE = "Chuyên gia"
# 24/11/2026 SPEC-AI-LLM-01 — tầng LLM Workers AI (miễn phí 10.000 Neurons/ngày, reset 00:00 UTC).
# "on" = bật; đổi "off" rồi triển khai lại để tắt hẳn. Hết hạn mức / lỗi / chậm ⇒ Worker tự trả lời bằng bộ lõi tĩnh.
AI_LLM = "on"
AI_MODEL_REPLY = "@cf/google/gemma-4-26b-a4b-it"
AI_MODEL_REWRITE = "@cf/meta/llama-3.2-3b-instruct"
AI_TIMEOUT_MS = "6000"

# Binding Workers AI (env.AI). Không cần khoá API hay thẻ. KHÔNG bật AI Gateway cache/log: chúng lưu câu hỏi của khách.
[ai]
binding = "AI"
