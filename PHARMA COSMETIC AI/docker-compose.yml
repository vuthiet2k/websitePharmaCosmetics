version: '3.8'

services:
  # 1. Vector Database - Qdrant
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: pharma_ai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_TELEMETRY=false

  # 2. Semantic Cache - Redis
  redis:
    image: redis:7.2-alpine
    container_name: pharma_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data

  # 3. FastAPI Gateway
  pharma_ai_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharma_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_API_BASE=http://vllm_engine:8000/v1
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
    depends_on:
      - qdrant
      - redis

