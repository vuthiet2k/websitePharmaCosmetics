project_id: pharma-cosmetics-theme-2026
name: "Pharma Cosmetics — Sapo Theme Package (Pharma + Skin Health + MOPS Admin)"
type: multi_surface_ecommerce_theme
platform: "Sapo (.bwt liquid-like templating) + Google Apps Script backend (MOPS)"
owner: thiethv@metatwin.vn
created: 2026-09-07
governance_profile: SCALED_LIGHTWEIGHT   # see POLICY.yaml — Applicability Engine decision, see DECISIONS.md ADR-001

description: >
  Xây dựng và mở rộng theme Sapo hiện có cho ngành dược - mỹ phẩm (dermatology / pharma
  cosmetics), giữ nguyên toàn bộ những gì đang chạy (theme skinhealthy, MOPS Admin,
  backend mops-gas). Bổ sung layout/brand "pharma" (clinical, y khoa) làm base theme
  chính, cộng thêm các trang còn thiếu theo 26 màn hình thiết kế Figma tham chiếu tại
  Pharma_Cosmetics_Figma_Project/ (quiz da AI, kết quả AI, hồ sơ chuyên gia, minh chứng
  lâm sàng, spa services, tin tức/blog quản trị, và loạt màn admin vận hành MOPS).

surfaces:
  - id: theme_pharma
    desc: "Layout/brand chính (layouts/theme.bwt) — clinical/dược, khách hàng cuối. REOPEN 2026-09-10: design tokens chuyển sang palette mới xlsx (ADR-007)."
  - id: theme_skinhealthy
    desc: "Layout/brand phụ (layouts/skinhealthy.bwt) — REOPEN 2026-09-10: rebrand hiển thị thành 'SKIN HEALTH BEAUTY by PHARMA COSMETICS' (ADR-007), slug/đường dẫn kỹ thuật không đổi. KHÔNG bỏ, tiếp tục mở rộng song song."
  - id: mops_admin_ui
    desc: "Layout quản trị (layouts/mops-admin.bwt) — frontend cho vận hành nội bộ. Ngoài phạm vi rebrand/token replacement M7-M10."
  - id: mops_gas_backend
    desc: "Backend Google Apps Script (mops-gas/) — ~16.9K LOC, order/inventory/shipping/signing/checkout ẩn danh. Hệ thống vận hành thật, KHÔNG phải phụ trợ nhỏ. REOPEN 2026-09-10: bổ sung SHEET.BOOKING_SLOTS (khoá slot đặt lịch) + SHEET.B2B_APPLICATIONS (hàng đợi duyệt B2B thủ công)."

non_goals_this_phase:
  - "Không viết lại kiến trúc Sapo/GAS (không có quyền chọn platform khác)."
  - "Không áp dụng nguyên văn toàn bộ 47 điều khoản V6.0 cho phần frontend theme (xem ADR-001)."
  - "Không tạo hạ tầng Docker/K8s/SLSA cho một theme .bwt tĩnh — không tồn tại trong stack thật."
  - "REOPEN ADR-007 (2026-09-10): không xây xác thực OTP SMS/Zalo (dùng link-token đơn giản), không cảm biến IoT chuỗi lạnh, không tự động hoá tra cứu API cơ quan thuế (MST) hoặc chữ ký số B2B (BLOCKED_EXTERNAL — duyệt thủ công thay thế), không dựng CI/CD enterprise (Lighthouse/compliance-lint chạy cục bộ, không phải cổng CI tự động)."

reference_design_source: >
  REOPEN 2026-09-10 (ADR-007): "Pharma Cosmetics-20260910T092731Z-1-001/Pharma Cosmetics/"
  (PharmaCosmetics_KhungGiaoDien_ChucNang_Portal_B2B_B2C.xlsx — 9 module MOD-01..09, 45 section;
  SkinHealthBeauty_KhungGiaoDien_ChucNang_Clinic_DichVu.xlsx — Clinic/Skin Health Beauty) là spec
  chuẩn hiện hành, THAY THẾ "Pharma_Cosmetics_Figma_Project/" (không còn tồn tại trên đĩa — 26 AC
  cũ (AC-01..26) vẫn giữ nguyên làm evidence lịch sử, không bị xoá).
