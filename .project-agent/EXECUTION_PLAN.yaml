    title: "ENV_FAILURE phát hiện giữa lúc verify T-104: 'localhost' treo trong Chromium/Playwright, chặn Visual Regression Gate"
    depends_on: []
    status: DONE
    capabilities_required: ["edit file", "run cli tool"]
    verification_method: "So sánh trước/sau: full playwright suite timeout hàng loạt trước fix, 39/39 PASS sau fix"
    min_evidence_grade: "E2"
    maps_to_ac: []
    resolution: >
      Phát hiện giữa quá trình verify T-104: Playwright (Chromium) bắt đầu treo/timeout khi
      navigate tới "http://localhost:3000/..." trong khi curl tới CÙNG URL vẫn trả 200 tức thì.
      Health-check riêng xác nhận page.goto('http://127.0.0.1:3000/...') thành công ngay — chỉ
      riêng tên "localhost" bị treo trong network stack của Chromium (nghi IPv6 ::1 timeout trước
      khi fallback IPv4), có thể liên quan sự kiện hệ thống báo thiếu bộ nhớ xảy ra giữa phiên
      (task-notification "killed... low memory"). Đã thử kill 30 tiến trình chrome.exe zombie tích
      luỹ từ các script Playwright tạm trong phiên (không close browser đúng cách khi lỗi giữa
      chừng) — KHÔNG giải quyết được, xác nhận đây là vấn đề DNS/network stack của "localhost",
      không phải resource contention. Đây là ENV_FAILURE (không phải CODE_DEFECT) chặn Visual
      Regression Gate bắt buộc (POLICY.yaml) cho mọi thay đổi UI — phải sửa trước khi tiếp tục.
      Fix: đổi playwright.config.js#baseURL từ "http://localhost:3000" sang
      "http://127.0.0.1:3000" — bỏ qua hoàn toàn bước DNS resolve.
      Verify: npx playwright test --update-snapshots sau fix: 39/39 PASS, không còn timeout.
      Ghi chú cho phiên sau: nếu gặp lại "localhost" bị treo trong Playwright/trình duyệt ở máy
      này, đây là vấn đề môi trường (không phải code) — dùng 127.0.0.1 trực tiếp.
      Evidence: .project-agent/evidence/build/T-105-localhost-dns-env-fix.log

