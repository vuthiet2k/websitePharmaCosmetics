  - id: T-103-nav-992-breakpoint-fix
    title: "Sửa known_gap từ T-102: nav header-menu bị chật/kẹt đúng ở 992px do lỗi JS off-by-one, không phải giới hạn layout"
    depends_on: [T-102-search-icon-header-merge]
    status: DONE
    capabilities_required: ["edit file", "run cli tool"]
    verification_method: "Playwright page.on('pageerror') thật bắt lỗi JS trước/sau, click thật #next xác nhận cuộn hoạt động, full regression suite (không update-snapshots) xác nhận 0 ảnh hưởng viewport khác"
    min_evidence_grade: "E2"
    maps_to_ac: [AC-48]
    resolution: >
      Xử lý theo /goal "update giao diện mới ngay" — known_gap tự ghi nhận ở T-102 là next_task
      duy nhất không cần người dùng quyết định. Điều tra sâu hơn (không chỉ đọc CSS như T-102)
      phát hiện ROOT CAUSE THẬT khác hẳn giả thuyết ban đầu ("không đủ chỗ layout"): đây là lỗi
      JS off-by-one, không phải giới hạn không gian. assets/main.js.bwt dòng 353 định nghĩa hàm
      horizontalNav() chỉ khi "wDWs > 992" (wDWs = window width đo 1 lần lúc load), nhưng dòng
      385 gọi hàm đó dưới điều kiện "matchMedia('(min-width:992px)')" — BAO GỒM đúng 992px. Ở
      đúng 992px: hàm không được định nghĩa nhưng vẫn bị gọi → "horizontalNav is not a function"
      (xác nhận thật qua Playwright page.on('pageerror'), không suy đoán) → toàn bộ phần còn lại
      của handler (bind #prev/#next, thêm class .overflow cho phép cuộn ngang) không chạy → 2 mục
      cuối (KHUYẾN MÃI, BLOG) bị .col-menu{overflow:hidden} che khuất vĩnh viễn, không cách nào
      tiếp cận ở đúng 992px (993px+ đã hoạt động đúng từ trước — cơ chế cuộn ngang + nút mũi tên
      prev/next là THIẾT KẾ CÓ SẴN của site cho trường hợp menu dài, không phải thứ cần xây mới).
      FIX: đổi "wDWs > 992" thành "wDWs >= 992" (1 dòng, khớp đúng ngưỡng matchMedia dùng ở dưới).
      Verify: page.on('pageerror') xác nhận lỗi biến mất; page.evaluate xác nhận
      .navigation-horizontal có class "overflow" + #next không còn "unactive"; click thật #next
      xác nhận nav cuộn đúng, cả 6 mục (gồm 2 mục trước đó bị che) vào được vùng nhìn. npm run
      build PASS. npx playwright test (KHÔNG update-snapshots, vì fix JS này chỉ ảnh hưởng đúng
      992px, không đổi bất kỳ viewport nào trong bộ test hiện có): 39/39 PASS nguyên bản — xác
      nhận 0 regression thị giác ở các độ rộng đã test. compliance-lint không đổi.
