parallel_track_skinhealthy:
  note: >
    Theme skinhealthy tiếp tục nhận cải tiến song song, không nằm trong 26 màn hình trên.
    Khi có yêu cầu cụ thể cho skinhealthy, thêm entry mới vào file này theo cùng format,
    và ưu tiên REUSE các snippet/component vừa tạo cho pharma nếu ngữ nghĩa giống nhau
    (theo 36.3 SHARED_KERNEL_RULE).
