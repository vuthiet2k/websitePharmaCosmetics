- screen: admin-waybill-detail
  action: CREATE
  target: snippets/mops_admin_tab_waybill_detail.bwt
  layout_ref: mops-admin
  reason: >
    UF-02 resolved (ADR-005): backend CHỈ CÓ MỘT PHẦN. GHTK có ghtkRefreshTracking (mops_01.js)
    -> timeline thật khả thi cho đơn GHTK. SPX không có API (nhập tay, xem
    mops_admin_tab_orders.bwt:1149) -> KHÔNG được giả lập timeline SPX, chỉ hiển thị trạng thái
    nhập tay hiện có. Thu hẹp phạm vi UI theo giới hạn backend thật.

- screen: admin-ghtk-hub
  action: CREATE
  target: snippets/mops_admin_tab_ghtk_hub.bwt
  layout_ref: mops-admin
  reason: >
    UF-02 resolved: backend GHTK đầy đủ (create/cancel/calcFee/refreshTracking/connectByLogin/
    syncPickAddresses trong mops_01.js). Đây chủ yếu là việc dựng UI thao tác hàng loạt trên
    các hàm đã có — KHÔNG cần thiết kế backend mới.

- screen: admin-signing
  action: CREATE
  target: snippets/mops_admin_tab_signing.bwt
  layout_ref: mops-admin
  reason: >
    UF-02 resolved: KHÔNG tìm thấy backend liên quan X-Signs/ký số trong toàn bộ mops-gas/.
    Tính năng HOÀN TOÀN MỚI — cần thiết kế backend (lưu hồ sơ ký số, quy trình ký, xác thực
    chữ ký) TRƯỚC khi xây UI. Effort/rủi ro cao hơn 3 tính năng admin còn lại, tách nhánh riêng.

- screen: admin-news
  action: USE_EXISTING_SAPO_BLOG_ADMIN
  target: "N/A trong theme package — dùng khu vực quản trị Blog có sẵn của Sapo"
  layout_ref: n/a
  reason: >
    UF-03 resolved (ADR-006): người dùng chọn dùng thẳng Sapo blog admin, không xây
    mops_admin_tab_news.bwt. Việc còn lại: đảm bảo blog.bwt/article.bwt (M4) hiển thị đúng nội
    dung, và cân nhắc (tuỳ chọn) thêm link điều hướng nhanh trong page.mops-admin.bwt.

- screen: admin-master-oms
  action: CREATE
  target: snippets/mops_admin_tab_master_oms.bwt
  layout_ref: mops-admin
  reason: >
    Bảng component/table atoms chuẩn dùng chung cho các tab admin — tạo trước để các tab khác
    REUSE thay vì tự dựng lại table/badge/status chip riêng lẻ. LƯU Ý (ADR-005): không tìm thấy
    khái niệm "OMS" riêng trong backend — đây là GIẢ ĐỊNH cần xác nhận với người dùng ngay khi
    bắt đầu T-50, trước khi build.

