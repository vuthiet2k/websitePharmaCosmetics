# POLICY.yaml — Applicability Engine output (dynamic, not hard-coded).
# Two governance profiles, per ADR-001 (DECISIONS.md): frontend theme surfaces get a
# scaled-down gate set; mops_gas_backend keeps the heavier gates because it is a live
# production system (anonymous checkout, real orders, shipping, digital signing).

compliance:
  jurisdiction: "VN"
  regulatory_frameworks:
    - "LAW_91_2025_QH15"      # Luật Bảo vệ dữ liệu cá nhân — áp dụng vì có form thu thập
                                # dữ liệu cá nhân/sức khoẻ: đặt lịch, AI skin quiz, patient
                                # portal, loyalty, customer-account, checkout.
    - "ND_356_2025_ND_CP"     # Nghị định hướng dẫn Luật 91 — quy định cụ thể xử lý PII.
    - "LAW_E_COMMERCE_VN"     # Luật/Nghị định TMĐT hiện hành (checkout, hoá đơn, khiếu nại) — áp dụng cho mops_gas_backend (thanh toán/đơn hàng thật).
  note: >
    Không hard-code điều luật cố định vào code. Khi có thay đổi văn bản pháp luật,
    cập nhật danh sách này và đánh dấu lại các AC liên quan đến PII/checkout là STALE.

profiles:

  frontend_theme:
    applies_to: [theme_pharma, theme_skinhealthy, mops_admin_ui]
    rationale: >
      Không có database riêng, không tự triển khai server. Là .bwt template + Tailwind CSS
      + JS chạy trong Sapo runtime hoặc admin-panel JS thuần. Áp SAST/DAST/mutation testing
      kiểu enterprise là vô nghĩa — không có infra tương ứng để chạy các công cụ đó.
    quality_gates:
      build:
        command_ref: "build_theme"       # COMMANDS.yaml
        required: true
      lint_and_static_checks:
        - "Liquid/.bwt syntax hợp lệ (dev-server preview render không lỗi)"
        - "Tailwind build không cảnh báo unknown class ở mức nghiêm trọng"
        - "Không secrets/API key hard-code trong .bwt/.js.bwt (grep theo COMMANDS.yaml#secret_scan)"
      visual_ux_gate:
        - "Đối chiếu render preview với HTML tham chiếu tương ứng trong Pharma_Cosmetics_Figma_Project/"
        - "Responsive: mobile (390px), tablet (768px), desktop (1280px)"
        - "Layout đúng layout_ref đã đăng ký (không tự dựng lại header/footer/sidebar) — xem 37. LAYOUT_REUSE_RULE"
      visual_regression_gate:
        - "REOPEN 2026-09-11 (Testing Gate — yêu cầu người dùng): mọi thay đổi UI bắt buộc qua Visual Regression Testing bằng pixel-based comparison (Playwright, xem COMMANDS.yaml#visual_regression_test)."
        - "Ngưỡng sai lệch cho phép: 0.05% pixel (maxDiffPixelRatio: 0.0005, playwright.config.js)."
        - "Sai lệch vượt ngưỡng = BLOCK_RELEASE — không được merge/release, phải điều tra nguyên nhân (thay đổi có chủ đích → cập nhật baseline có ghi chú lý do; không chủ đích → CODE_DEFECT, sửa theo mục 34)."
        - "Evidence bắt buộc E3 (Independent Tool Log): report HTML + baseline/diff screenshot lưu tại .project-agent/evidence/visual/, ghi entry vào EVIDENCE_INDEX.json — không tự khẳng định PASSED nếu không có report kèm theo."
        - "LẦN CHẠY ĐẦU TIÊN cho 1 trang = thiết lập baseline (KHÔNG phải bằng chứng regression — chưa có gì để so sánh). Chỉ tính là gate PASSED thật từ lần chạy thứ 2 trở đi so với baseline đã tồn tại."
      accessibility_gate:
        - "Contrast tối thiểu AA cho text chính"
        - "Form bắt buộc có label + trạng thái lỗi rõ ràng (đặt lịch, quiz, checkout, account)"
      pii_form_gate:
        - "Mọi form thu thập dữ liệu cá nhân/sức khoẻ (booking, ai-quiz, patient-portal, loyalty, customer-account, b2b-distribution) phải có: mục đích thu thập rõ ràng + checkbox đồng ý (consent) + link chính sách bảo mật."
      compliance_language_gate:
        - "REOPEN ADR-007 (RULE-P0-02/06 xlsx): chạy compliance_lint (COMMANDS.yaml) trước release — cấm danh xưng 'Bác sĩ'/'Bộ Y Tế'/'cấp phép' dùng như thẩm quyền y tế chính thức, chuẩn hoá về 'Chuyên gia'. Thực thi bằng script cục bộ (E2), KHÔNG phải CI gatekeeper tự động."
      perf_budget_gate:
        - "REOPEN ADR-007 (RULE-P0-04 xlsx): chạy perf_budget_lighthouse (COMMANDS.yaml) cục bộ, đối chiếu LCP<1.2s/CLS=0/TBT<50ms trước release. Evidence E2 (log thủ công), KHÔNG phải cổng CI enterprise (giữ nguyên ranh giới ADR-001)."
    evidence_minimum_grade: "E2"   # execution output (build/preview log) đủ cho PASSED ở tier này
    forbidden:
      - "Mutation testing / Stryker (không áp dụng — không có unit test suite logic nghiệp vụ ở tầng template)"
      - "SAST/DAST tool enterprise (SonarQube/ZAP) — không có trong stack, không giả lập kết quả"

  mops_gas_backend:
    applies_to: [mops_gas_backend]
    rationale: >
      Hệ thống vận hành thật: checkout ẩn danh (executeAs USER_DEPLOYING, access
      ANYONE_ANONYMOUS), xử lý đơn hàng/tồn kho/vận đơn GHTK-SPX/ký số X-Signs.
      Lỗi ở đây ảnh hưởng tiền thật và dữ liệu khách hàng thật -> giữ gate nặng hơn.
    quality_gates:
      release_discipline:
        - "TUYỆT ĐỐI không 'clasp deploy' trần. Chỉ 'clasp deploy -i <deploymentId cố định>'."
        - "Mọi deploy phải giữ nguyên /exec URL đang lưu ở configs/settings_data.json#mops_gas_url."
        - "Mỗi deploy = 1 giai đoạn refactor, giữ version cũ trong GAS để rollback 1-click."
      data_integrity_gate:
        - "Không có Postgres/FK thật — thay thế bằng: idempotency key cho ghi đơn hàng, validate schema đầu vào trước khi ghi Sheet/DB, khoá race-condition cho các thao tác cập nhật tồn kho."
        - "REOPEN ADR-007: SHEET.BOOKING_SLOTS (T-83) và SHEET.B2B_APPLICATIONS (T-81) bắt buộc có capacity-check/khoá race-condition tương đương — không dùng append-only không kiểm tra trùng lặp cho các sheet mới này."
      integration_gate:
        - "Webhook/API bên thứ 3 (GHTK, SPX, X-Signs) phải verify bằng response payload thực + chữ ký (nếu có), không chỉ HTTP 200."
        - "Test qua sandbox/staging trước khi deploy vào deploymentId production."
      secrets_lifecycle:
        - "MOPS_EDGE_SECRET, GAS_URL, KV_REST_API_TOKEN không commit vào git (đã có .gitignore/.env.example — duy trì)."
        - "Secret scan trước mỗi commit chạm vào mops-gas/ hoặc api/."
      compliance_gate:
        - "Checkout ẩn danh vẫn phải tuân thủ Luật 91/2025/QH15 khi lưu tên/SĐT/địa chỉ khách hàng."
    evidence_minimum_grade: "E3"   # cần log độc lập (clasp deployments, webhook log thực) — không tự nhận PASSED
    forbidden:
      - "Không tự ý đổi appsscript.json access sang ANYONE (sẽ khoá checkout khách vãng lai)"
      - "Không bypass rule fixed-deploymentId để 'test nhanh'"
      - "REOPEN ADR-007: cấm giả lập kết quả tra cứu API cơ quan thuế (MST) hoặc chữ ký số cho B2B onboarding — 2 hạng mục này là BLOCKED_EXTERNAL, phải đi qua hàng đợi duyệt thủ công admin, không tự động hoá xác thực khi chưa có tích hợp thật."
      - "REOPEN ADR-007: cấm tạo dữ liệu cảm biến IoT chuỗi lạnh (nhiệt độ vận chuyển) — tính năng đã bị loại khỏi phạm vi, order-tracking chỉ hiển thị timeline GHTK thật."

anti_thrashing:
  max_repeated_failure_fingerprint: 3
  action_on_exceed: "Hạ trạng thái task -> HUMAN_REVIEW, ghi vào EVENTS.jsonl"

mock_policy:
  frontend_theme: "Cho phép mock data (data/*.js) khi preview local — đã là pattern sẵn có của dự án."
  mops_gas_backend: "Cấm mock ở release gate — bắt buộc verify qua deployment /exec thật hoặc bản /dev test trước."
